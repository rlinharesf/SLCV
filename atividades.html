<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Atividades</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card-bg: #ffffff;
      --border: #e2e4e9;
      --text: #1a1d23;
      --text-muted: #6b7280;
      --text-xmuted: #9ca3af;
      --accent: #3b5bdb;
      --accent-light: #eef2ff;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);

      /* status */
      --s-todo-bg: #f1f3f5;      --s-todo-c: #495057;
      --s-doing-bg: #e7f5ff;     --s-doing-c: #1971c2;
      --s-review-bg: #fff3bf;    --s-review-c: #e67700;
      --s-remind-bg: #fff0f6;    --s-remind-c: #c2255c;
      --s-hold-bg: #f3f0ff;      --s-hold-c: #7048e8;
      --s-done-bg: #ebfbee;      --s-done-c: #2f9e44;

      /* priority */
      --p-high: #fa5252;
      --p-med: #fd7e14;
      --p-low: #51cf66;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    /* ── Header ── */
    header {
      max-width: 1400px;
      margin: 0 auto 28px;
      display: flex;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header-title h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -.03em;
      color: var(--text);
    }
    .header-title p {
      font-size: .85rem;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .search-wrap { position: relative; }
    .search-wrap input {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px 7px 34px;
      font-size: .85rem;
      width: 220px;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .filter-btn {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: .82rem;
      font-weight: 500;
      cursor: pointer;
      background: var(--card-bg);
      color: var(--text-muted);
      transition: all .15s;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .updated-badge {
      font-size: .78rem;
      color: var(--text-xmuted);
      white-space: nowrap;
    }

    /* ── Grid ── */
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      align-items: start;
    }

    /* ── List card ── */
    .list-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .list-card.placeholder { border-style: dashed; background: transparent; }

    .list-header {
      padding: 16px 18px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1.5px solid var(--border);
    }
    .list-icon { font-size: 1.2rem; flex-shrink: 0; }
    .list-meta { flex: 1; min-width: 0; }
    .list-name { font-size: .95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-source { font-size: .72rem; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--text-xmuted); margin-top: 1px; }
    .list-count {
      font-size: .78rem; font-weight: 600;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 20px;
      padding: 2px 9px;
      flex-shrink: 0;
    }
    .list-count.zero { background: var(--bg); color: var(--text-muted); }

    /* ── Tasks ── */
    .tasks { padding: 4px 0; max-height: 520px; overflow-y: auto; }
    .tasks::-webkit-scrollbar { width: 4px; }
    .tasks::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .task-item {
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transition: background .1s;
      text-decoration: none;
      color: inherit;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item:hover { background: #fafbfc; }

    .task-left { display: flex; align-items: flex-start; gap: 8px; flex: 1; min-width: 0; }
    .priority-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 6px;
    }
    .p-Alta, .p-1\.\ Alta { background: var(--p-high); }
    .p-Média, .p-2\.\ Média { background: var(--p-med); }
    .p-Baixa, .p-3\.\ Baixa { background: var(--p-low); }
    .p-none { background: var(--border); }

    .task-body { flex: 1; min-width: 0; }
    .task-name {
      font-size: .875rem;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text);
      word-break: break-word;
    }
    .task-name.hidden-task { display: none; }

    .task-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; align-items: center; }

    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: .72rem; font-weight: 500;
      border-radius: 6px; padding: 2px 7px;
      white-space: nowrap;
    }
    .badge-todo    { background: var(--s-todo-bg);   color: var(--s-todo-c); }
    .badge-doing   { background: var(--s-doing-bg);  color: var(--s-doing-c); }
    .badge-review  { background: var(--s-review-bg); color: var(--s-review-c); }
    .badge-remind  { background: var(--s-remind-bg); color: var(--s-remind-c); }
    .badge-hold    { background: var(--s-hold-bg);   color: var(--s-hold-c); }
    .badge-done    { background: var(--s-done-bg);   color: var(--s-done-c); }
    .badge-tag     { background: var(--bg); color: var(--text-muted); }
    .badge-date    { background: var(--bg); color: var(--text-muted); }
    .badge-overdue { background: #fff5f5; color: #c92a2a; }

    .task-desc {
      font-size: .78rem;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Placeholder ── */
    .placeholder-body {
      padding: 32px 18px;
      text-align: center;
    }
    .placeholder-body .ph-icon { font-size: 2rem; margin-bottom: 10px; }
    .placeholder-body p { font-size: .85rem; color: var(--text-muted); line-height: 1.5; }
    .placeholder-body strong { color: var(--text); }

    /* ── Section divider ── */
    .section-label {
      max-width: 1400px;
      margin: 28px auto 12px;
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-xmuted);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Empty state ── */
    .empty-state {
      padding: 28px 18px;
      text-align: center;
      font-size: .83rem;
      color: var(--text-xmuted);
    }

    /* ── External link icon ── */
    .ext-link { opacity: 0; flex-shrink: 0; color: var(--text-xmuted); margin-top: 2px; }
    .task-item:hover .ext-link { opacity: 1; }
  </style>
</head>

const TODAY = new Date('2026-05-23');

function fmt(iso) {
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function isOverdue(iso) {
  if (!iso) return false;
  return new Date(iso + 'T00:00:00') < TODAY;
}
function statusBadge(s) {
  const map = {
    'Não iniciado': ['badge-todo', 'A fazer'],
    'A Fazer':      ['badge-todo', 'A fazer'],
    'Em andamento': ['badge-doing', 'Em andamento'],
    'Em Andamento': ['badge-doing', 'Em andamento'],
    'Em Revisão':   ['badge-review', 'Em revisão'],

    'On-hold':      ['badge-hold', 'On-hold'],
    'Concluído':    ['badge-done', 'Concluído'],
  };
  const [cls, label] = map[s] || ['badge-todo', s || '—'];
  return `<span class="badge ${cls}">${label}</span>`;

// ── Render ────────────────────────────────────────────────────────────────────

let activeFilter = 'all';

function buildTaskHTML(task) {
  const overdue = isOverdue(task.prazo);
  const statusKey = task.status;

  const pClass = task.priority ? 'p-' + task.priority.replace(/\s/g, '\\ ') : 'p-none';

  const statusHtml = statusBadge(statusKey);

  const tagsHtml = task.tags.map(t => `<span class="badge badge-tag">${t}</span>`).join('');

  let dateHtml = '';
  if (task.prazo) {
    const cls = overdue ? 'badge-overdue' : 'badge-date';
    const prefix = overdue ? '⚠ Venceu ' : '';
    dateHtml = `<span class="badge ${cls}">${prefix}${fmt(task.prazo)}</span>`;
  }

  const descHtml = task.desc ? `<div class="task-desc">${task.desc}</div>` : '';

  const doingStatuses = ['Em andamento', 'Em Andamento', 'Em Revisão'];
  const isDoing = doingStatuses.includes(task.status);
  const isOverdueTask = overdue;

  return `
    <a class="task-item" href="${task.url}" target="_blank" rel="noopener"
       data-status="${task.status.toLowerCase()}"
       data-doing="${isDoing}"
       data-overdue="${isOverdueTask}"
       data-name="${task.name.toLowerCase()}">
      <div class="task-left">
        <span class="priority-dot ${pClass}"></span>
        <div class="task-body">
          <div class="task-name">${task.name}</div>
          ${descHtml}
          <div class="task-meta">
            ${statusHtml}
            ${tagsHtml}
            ${dateHtml}
          </div>
        </div>
      </div>
      <svg class="ext-link" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>`;
}

function buildListCard(list) {
  const tasksHtml = list.tasks.map(buildTaskHTML).join('');
  const count = list.tasks.length;
  const countCls = count === 0 ? 'zero' : '';
  return `
    <div class="list-card" id="card-${list.id}">
      <div class="list-header">
        <span class="list-icon">${list.icon}</span>
        <div class="list-meta">
          <div class="list-name">${list.name}</div>
          <div class="list-source">Notion</div>
        </div>
        <a href="${list.url}" target="_blank" rel="noopener">
          <span class="list-count ${countCls}" id="count-${list.id}">${count}</span>
        </a>
      </div>
      <div class="tasks" id="tasks-${list.id}">${tasksHtml || '<div class="empty-state">Nenhuma tarefa ativa</div>'}</div>
    </div>`;
}

function buildPlaceholderCard(list) {
  return `
    <div class="list-card placeholder" id="card-${list.id}">
      <div class="list-header">
        <span class="list-icon">${list.icon}</span>
        <div class="list-meta">
          <div class="list-name">${list.name}</div>
          <div class="list-source">iPhone Lembretes</div>
        </div>
        <span class="list-count zero">—</span>
      </div>
      <div class="placeholder-body">
        <div class="ph-icon">⏳</div>
        <p><strong>Integração pendente</strong><br/>Me conta qual lista do Reminders você quer conectar e configuramos juntos.</p>
      </div>
    </div>`;
}

function renderAll() {
  const gn = document.getElementById('grid-notion');
  const gr = document.getElementById('grid-reminders');
  gn.innerHTML = DATA.notionLists.map(buildListCard).join('');
  gr.innerHTML = DATA.reminderLists.map(buildPlaceholderCard).join('');

  const d = new Date('2026-05-23');
  document.getElementById('updated-at').textContent = 'Atualizado em ' + d.toLocaleDateString('pt-BR');
}

// ── Filter ────────────────────────────────────────────────────────────────────

function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function filterTasks() { applyFilters(); }

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  DATA.notionLists.forEach(list => {
    const items = document.querySelectorAll(`#tasks-${list.id} .task-item`);
    let visible = 0;
    items.forEach(item => {
      const name = item.dataset.name;
      const doing = item.dataset.doing === 'true';
      const overdue = item.dataset.overdue === 'true';

      const matchSearch = !q || name.includes(q);
      let matchFilter = true;
      if (activeFilter === 'doing') matchFilter = doing;
      if (activeFilter === 'overdue') matchFilter = overdue;

      const show = matchSearch && matchFilter;
      item.style.display = show ? '' : 'none';
      if (show) visible++;
    });

    const countEl = document.getElementById(`count-${list.id}`);
    if (countEl) {
      countEl.textContent = visible;
      countEl.className = 'list-count' + (visible === 0 ? ' zero' : '');
    }

    // empty state
    const tasksEl = document.getElementById(`tasks-${list.id}`);
    let emptyEl = tasksEl.querySelector('.empty-state');
    if (visible === 0) {
      if (!emptyEl) {
        emptyEl = document.createElement('div');
        emptyEl.className = 'empty-state';
        emptyEl.textContent = 'Nenhuma tarefa encontrada';
        tasksEl.appendChild(emptyEl);
      }
    } else if (emptyEl) {
      emptyEl.remove();
    }
  });
}

renderAll();
</script>
